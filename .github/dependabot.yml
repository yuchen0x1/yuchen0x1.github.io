version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      vite:
        patterns: ['vite', '@vitejs/*', 'vitest']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ['github/codeql-action*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
