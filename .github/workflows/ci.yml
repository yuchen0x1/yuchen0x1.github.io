name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run verify
      - run: npm run build
      - run: npm run test:dist
      - name: Verify Linux container
        if: runner.os == 'Linux'
        run: |
          docker build -t portfolio-ci .
          docker run --detach --rm --name portfolio-ci -p 127.0.0.1:8080:8080 portfolio-ci
          trap 'docker stop portfolio-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/version.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs portfolio-ci
          exit 1
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
