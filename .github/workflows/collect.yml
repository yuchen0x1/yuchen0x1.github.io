name: Refresh public GitHub snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: github-snapshot
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: portfolio-snapshots
          path: .snapshot-worktree
      - name: Restore previous snapshot
        run: cp .snapshot-worktree/public/data/{repos,history}.json public/data/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: github-cache-${{ github.repository }}-${{ github.run_id }}
          restore-keys: github-cache-${{ github.repository }}-
      - run: npm ci
      - run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data-only changes
        run: |
          cp public/data/{repos,history}.json .snapshot-worktree/public/data/
          cd .snapshot-worktree
          git add -- public/data/repos.json public/data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(data): refresh public GitHub snapshot'
          git push origin HEAD:portfolio-snapshots

