name: Refresh public GitHub snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: github-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: github-cache-${{ github.repository }}-${{ github.run_id }}
          restore-keys: github-cache-${{ github.repository }}-
      - run: npm ci
      - run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data-only changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(data): refresh public GitHub snapshot'
          file_pattern: public/data/repos.json public/data/history.json

