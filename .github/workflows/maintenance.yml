name: Project maintenance

on:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Capture complete dependency audit
        shell: bash
        run: |
          npm audit --json --registry=https://registry.npmjs.org > dependency-audit.json || test "$?" -eq 1
          node scripts/summarize-audit.mjs dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-dependency-audit
          path: dependency-audit.json
          retention-days: 30
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published sites and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-published.mjs
